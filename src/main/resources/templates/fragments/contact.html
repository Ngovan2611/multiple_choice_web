<div th:fragment="contact">
    <div class="contact-popup" id="contactPopup">
        <h3>Liên hệ hỗ trợ</h3>
        <button class="contact-btn" id="studySupportBtn">
            Hỗ trợ học tập
        </button>
        <button class="contact-btn" id="otherSupportBtn">
            Hỗ trợ vấn đề khác
        </button>
    </div>
    <div class="contact-floating" id="contactBtn">
        <div class="badge">1</div>
        💬
    </div>
    <div class="qr-overlay" id="qrOverlay">
        <div class="qr-modal">
            <span class="close-qr" id="closeQr">✖</span>
            <h3>Quét QR để liên hệ Zalo</h3>
            <img src="/image/qr.png">
            <p>Quét mã để được hỗ trợ nhanh nhất</p>
        </div>
    </div>
</div>
