<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiTot - Login</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">


</head>

<body>
<div class="container">
    <!-- Left -->
    <div class="login-section">
        <div class="login-box">
            <h1 class="logo"><a href="/home">ThiTot</a></h1>
            <h2>Welcome back!</h2>
            <p>Enter your credentials to access your account</p>

            <form action="/login" method="post" id="form-login">
                <div class="input-group">
                    <i class='bx bx-user'></i>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <i class='bx bx-lock'></i>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <i class='bx bx-show toggle' onclick="togglePassword()"></i>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div th:if="${error}" id="error-message" class="error-box show">
                    <p th:text="${error}"></p>
                </div>
            </form>
        </div>
    </div>

    <div class="image-section">
        <img src="/image/background.png" alt="Login Background">
    </div>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
    }

    // Khi có error từ server (Thymeleaf render)
    window.addEventListener("DOMContentLoaded", () => {
        const errorBox = document.getElementById("error-message");
        if (errorBox) {
            requestAnimationFrame(() => errorBox.classList.add("show"));
            setTimeout(() => {
                errorBox.classList.remove("show");
            }, 3000);
        }
    });
</script>
</body>
</html>
