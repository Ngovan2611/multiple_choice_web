<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Lớp Học</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">

    <style>
        /* --- GLOBAL STYLES (Giữ nguyên) --- */
        :root {
            --primary-color: #7a5cf4;
            --secondary-color: #39c8eb;
            --success-color: #38b466;
            --text-color: #333;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* --- HEADER --- */
        .teacher-header {
            background-color: #7a5cf4;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(122, 92, 244, 0.3);
            margin-bottom:20px;
        }
        .teacher-header h1 { margin: 0; font-size: 24px; }
        .teacher-header h1 span { color: #ffe36d; }
        .menu a {
            color: white;
            margin-left: 30px;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .menu a:hover { opacity: 1; }
        a{
            text-decoration: none;
        }

        /* --- MAIN CONTAINER --- */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* --- STATS CARDS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-info h3 { margin: 0 0 5px 0; color: #888; font-size: 14px; text-transform: uppercase; }
        .stat-info p { margin: 0; font-size: 28px; font-weight: bold; color: var(--text-color); }
        .stat-icon {
            font-size: 40px;
            padding: 15px;
            border-radius: 50%;
            color: white;
        }
        .icon-blue { background-color: var(--secondary-color); }
        .icon-purple { background-color: var(--primary-color); }
        .icon-green { background-color: var(--success-color); }

        /* --- TOOLBAR --- */
        .toolbar-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .toolbar-left { display: flex; gap: 15px; align-items: center; width: 100%; }
        .toolbar-title { font-size: 20px; font-weight: bold; margin-right: 15px; border-left: 4px solid var(--primary-color); padding-left: 10px; white-space: nowrap;}

        /* Form tìm kiếm */
        .search-form { display: flex; gap: 10px; flex-grow: 1; }
        select, input[type="text"] {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"] { flex-grow: 1; }

        /* --- TABLE --- */
        .table-wrapper {
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background-color: #eef2f7; }
        th {
            padding: 18px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
        }
        td {
            padding: 15px 18px;
            border-bottom: 1px solid #eee;
            color: #444;
            vertical-align: middle;
        }
        tr:hover { background-color: #fafbff; }

        .student-info { display: flex; align-items: center; gap: 12px; }
        .avatar-circle {
            width: 35px; height: 35px;
            background-color: #e0e7ff;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>
<header class="teacher-header">
    <a href="/teacher/home" style="text-decoration: none; color: inherit;">
        <h1>Thi<span>Tot</span></h1>
    </a>
    <nav class="menu">
        <a href="/teacher/question_bank">Ngân hàng câu hỏi</a>
        <a href="/teacher/exam">Đề thi</a>
        <a href="/teacher/class" style="opacity: 1; border-bottom: 2px solid white; padding-bottom: 5px;">Lớp học</a>
        <a href="/teacher/profile">Thông tin cá nhân</a>
        <a href="/logout">Đăng xuất</a>
    </nav>
</header>

<div class="main-container">

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <h3>Tổng số học sinh</h3>
                <p th:text="${totalStudents}">0</p>
            </div>
            <div class="stat-icon icon-purple"><i class='bx bx-user'></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>Lớp chủ nhiệm</h3>
                <p>10A1</p>
            </div>
            <div class="stat-icon icon-blue"><i class='bx bx-chalkboard'></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>Đang hoạt động</h3>
                <p th:text="${totalStudents}">0</p>
            </div>
            <div class="stat-icon icon-green"><i class='bx bx-user-check'></i></div>
        </div>
    </div>

    <div class="toolbar-container">
        <div class="toolbar-left" style="width: 100%;">
        <span class="toolbar-title">
            Danh sách lớp: <span th:text="${currentClass != null ? currentClass : 'Chưa phân công'}" style="color: #7a5cf4;"></span>
        </span>

            <form action="/teacher/class" method="get" style="display: flex; gap: 10px; flex-grow: 1; align-items: center;">

                <select name="sort" onchange="this.form.submit()" style="min-width: 150px;">
                    <option value="asc" th:selected="${sort == 'asc'}">Tên (A-Z)</option>
                    <option value="desc" th:selected="${sort == 'desc'}">Tên (Z-A)</option>
                </select>

                <div class="search-container" style="flex-grow: 1; position: relative;">
                    <input type="text" name="keyword"
                           th:value="${keyword}"
                           placeholder="Nhập tên học sinh trong lớp..."
                           style="width: 100%; padding-right: 15px;">
                    <i class='bx bx-search' style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #7a5cf4;"></i>
                </div>

                <button type="submit" style="display: none;"></button>

                <a href="/teacher/class" class="btn-cancel" style="text-decoration: none; display: flex; align-items: center;">
                    <i class='bx bx-refresh'></i>
                </a>
            </form>
        </div>
    </div>

    <div th:if="${message}" style="margin: 20px; padding: 15px; background-color: #fff3cd; color: #856404; border-radius: 8px; border: 1px solid #ffeeba;">
        <i class='bx bx-info-circle'></i> <span th:text="${message}"></span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Họ và tên</th>
                <th>Lớp</th>
                <th>Số điện thoại</th>
                <th>Email</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td>
                    <div class="student-info">
                        <div class="avatar-circle"
                             th:text="${s.full_name != null and s.full_name.length() > 0 ? s.full_name.substring(0, 1) : 'U'}">U</div>
                        <span th:text="${s.full_name}">Tên HS</span>
                    </div>
                </td>
                <td th:text="${s.className}">Lớp</td>
                <td>
                        <span style="background: #e0f7fa; color: #006064; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;"
                              th:text="${s.phone}">Số điện thoại</span>
                </td>
                <td th:text="${s.email != null ? s.email : 'Chưa cập nhật'}">Email</td>
            </tr>

            <tr th:if="${students == null or students.empty}">
                <td colspan="4" style="text-align: center; padding: 20px; color: #888;">
                    Chưa có học sinh nào trong hệ thống.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
